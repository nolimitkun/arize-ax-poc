[project]
name = "arize-ax-poc"
version = "0.1.0"
description = "A support-copilot agent built to exercise the main features of Arize AX"
requires-python = ">=3.10"
dependencies = [
    "arize[otel]>=8.0.0",
    "arize-otel>=0.9.0",
    "arize-phoenix-evals>=2.0.0",
    "openinference-instrumentation>=0.1.0",
    "openinference-instrumentation-openai>=0.1.0",
    "openinference-semantic-conventions>=0.1.0",
    "openai>=1.60.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py310"
